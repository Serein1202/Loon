# 规则路由
rules:
  # 广告拦截
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((GEOIP,CN,no-resolve)))),REJECT

  - DOMAIN-SUFFIX,quark.cn,国外网站
  - DOMAIN-SUFFIX,quark.com,国外网站
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Reject,REJECT
  - RULE-SET,AI,AI
  - RULE-SET,Github,Github
  - RULE-SET,Microsoft,DIRECT
  - RULE-SET,YouTube,谷歌服务
  - RULE-SET,Google,谷歌服务
  - RULE-SET,WeChat,微信消息
  - RULE-SET,X,推特消息
  - RULE-SET,Telegram,电报消息
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Epic,游戏平台
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Proxy,国外网站
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,AppleProxy,全球手动
  - RULE-SET,Lan,DIRECT
  - GEOIP,CN,DIRECT

  # 兜底规则
  - MATCH,兜底分流

